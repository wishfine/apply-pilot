[project]
name = "apply-pilot"
version = "0.1.0"
description = "A local-first AI job application agent for Chinese recruitment platforms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "aiosqlite>=0.20.0",
    "platformdirs>=4.2.0",
    "httpx>=0.27.0",
    "playwright>=1.43.0",
]

[project.scripts]
applypilot = "applypilot.cli.main:app"

[build-system]

requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["applypilot"]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
]

